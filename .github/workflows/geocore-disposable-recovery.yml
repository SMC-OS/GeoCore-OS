name: GeoCore disposable replacement-infrastructure recovery

# DISPOSABLE project geocore-disposable-qa-7f3c9a2e81, environment `recovery` ONLY. Never targets production, shared staging or the
# existing isolated QA project (those ids are refused by name). Spending cap: $3 (owner-approved). Synthetic data only.
# Manual dispatch only. mode=verify is read-only.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "verify (read-only disposable token scope check) | probe-qa-template (read-only) | capture (QA container task: matched capture, emits the verified bundle; ends with exact-SHA QA restoration) | recover (provision, restore from the bundle only, verify, ALWAYS tear down) | teardown (verify/force empty)"
        type: choice
        options: [verify, probe-qa-template, capture, recover, teardown, probe-app]
        default: verify
      inspect_deployment_id:
        description: "teardown mode: also print the status/meta of this deployment id (read-only)"
        type: string
        default: ""
      bundle_run_id:
        description: "recover: workflow run id that produced the geocore-recovery-bundle artifact"
        type: string
        default: ""
  push:
    branches: [qa/disposable-recovery]
    paths: ['.github/workflows/geocore-disposable-recovery.yml']

permissions:
  contents: read
  actions: read
  packages: write

concurrency:
  group: geocore-disposable-recovery
  cancel-in-progress: false

jobs:
  verify:
    if: ${{ inputs.mode != 'probe-qa-template' && inputs.mode != 'capture' && inputs.mode != 'recover' && inputs.mode != 'teardown' && inputs.mode != 'probe-app' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DISPOSABLE_PROJECT_ID: 482d0eff-ecd3-4457-8834-e0b49e897e42
      RECOVERY_ENVIRONMENT_ID: 43eadd7f-40be-4cdf-acb8-e1a8b33ba3b8
      RAILWAY_TOKEN: ${{ secrets.GEOCORE_DISPOSABLE_RECOVERY_RAILWAY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - run: npm install --global @railway/cli@4
      - name: Verify the token authenticates only against the exact disposable project and recovery environment
        shell: bash
        run: bash scripts/disposable/verify_token_scope.sh "$DISPOSABLE_PROJECT_ID" "$RECOVERY_ENVIRONMENT_ID" recovery

  probe-qa-template:
    if: ${{ inputs.mode == 'probe-qa-template' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RAILWAY_TOKEN: ${{ secrets.GEOCORE_QA_RAILWAY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - run: npm install --global @railway/cli@4
      - name: Describe the existing isolated-QA services (read-only; names and non-secret settings only)
        shell: bash
        run: bash scripts/disposable/probe_qa_template.sh

  capture:
    if: ${{ inputs.mode == 'capture' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    concurrency:
      group: geocore-qa-acceptance
      cancel-in-progress: false
    env:
      QA_API: https://geocore-api-qa-acceptance.up.railway.app
      QA_ENVIRONMENT_ID: f948241d-446f-43ed-bff0-5d12decffd50
      RAILWAY_TOKEN: ${{ secrets.GEOCORE_QA_RAILWAY_TOKEN }}
      EXPECTED_SHA: f503041822923bd4b07a0bebaa6748ba71873740
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - run: npm install --global @railway/cli@4
      - name: Capture inside isolated QA, retrieve the bundle through the verified transfer, restore QA to the exact candidate
        shell: bash
        run: |
          set -u -o pipefail; set +e
          source scripts/qa/qa_railway_ops.sh
          [[ "$(start_get)" == "$QA_ORIG_START" ]] || { echo "start command is not the original; restore first"; exit 1; }
          tar -czf /tmp/capture-src.tgz scripts/recovery/content_fingerprint.py scripts/recovery/matched_bundle.py scripts/recovery/restore_upload_bundle.py scripts/recovery/recovery_safety.py scripts/qa/qa_recovery_drill.py scripts/disposable/bundle_transfer.py
          echo "task bundle base64 bytes: $(base64 -w0 /tmp/capture-src.tgz | wc -c) (Railway variable limit 32768)"
          run_container_task scripts/qa/container_tasks/capture.sh /tmp/capture-src.tgz; task_rc=$?
          read -r TASK_DEP _ _ < <(latest_deployment)
          railway logs "$TASK_DEP" --deployment --service geocore-api-qa --environment "$QA_ENV" --lines 5000 2>&1 | tr -d '\r' > capture-log.txt
          echo "task deployment log lines: $(wc -l < capture-log.txt), bundle lines: $(grep -c 'BUNDLE|' capture-log.txt)"
          if [[ "$(grep -c 'BUNDLE|' capture-log.txt)" == 0 ]]; then echo "first log line (non-bundle, for diagnosis): $(head -1 capture-log.txt | cut -c1-200)"; fi
          python3 scripts/disposable/bundle_transfer.py decode capture-log.txt recovery-bundle.tgz; decode_rc=$?
          rm -f capture-log.txt
          restore_qa_config_pinned "$EXPECTED_SHA"; restore_rc=$?
          echo "task_rc=$task_rc decode_rc=$decode_rc restore_rc=$restore_rc"
          [[ $decode_rc -eq 0 ]] && sha256sum recovery-bundle.tgz | cut -d' ' -f1 > recovery-bundle.sha256
          exit $(( task_rc != 0 || decode_rc != 0 || restore_rc != 0 ))
      - name: Retain the verified bundle (synthetic data only; one day)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: geocore-recovery-bundle
          path: |
            recovery-bundle.tgz
            recovery-bundle.sha256
          retention-days: 1
          if-no-files-found: warn

  recover:
    if: ${{ inputs.mode == 'recover' || inputs.mode == 'teardown' || inputs.mode == 'probe-app' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      RAILWAY_TOKEN: ${{ secrets.GEOCORE_DISPOSABLE_RECOVERY_RAILWAY_TOKEN }}
      EXPECTED_SHA: f503041822923bd4b07a0bebaa6748ba71873740
      EVID_FILE: recovery-evidence.txt
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - run: npm install --global @railway/cli@4
      - name: Disposable token scope (must be exactly the disposable project and recovery environment)
        run: bash scripts/disposable/verify_token_scope.sh 482d0eff-ecd3-4457-8834-e0b49e897e42 43eadd7f-40be-4cdf-acb8-e1a8b33ba3b8 recovery
      - name: Teardown / verify empty
        if: ${{ inputs.mode == 'teardown' && inputs.inspect_deployment_id == '' }}
        run: bash scripts/disposable/recovery_run.sh teardown
      - name: Inspect a failed deployment (read-only, no variables printed)
        if: ${{ inputs.mode == 'teardown' && inputs.inspect_deployment_id != '' }}
        run: bash scripts/disposable/recovery_run.sh inspect "${{ inputs.inspect_deployment_id }}"
      - name: Download the captured bundle (artifact from the capture run)
        if: ${{ inputs.mode == 'recover' }}
        uses: actions/download-artifact@v4
        with:
          name: geocore-recovery-bundle
          run-id: ${{ inputs.bundle_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Check out the candidate at the exact commit (separate directory)
        if: ${{ inputs.mode == 'recover' || inputs.mode == 'probe-app' }}
        uses: actions/checkout@v4
        with:
          ref: f503041822923bd4b07a0bebaa6748ba71873740
          path: candidate
          persist-credentials: false
      - name: Build the API image from exactly the candidate and publish it privately
        if: ${{ inputs.mode == 'recover' || inputs.mode == 'probe-app' }}
        shell: bash
        env:
          GH_TOKEN_VALUE: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
        run: |
          set -eu -o pipefail
          [[ "$(git -C candidate rev-parse HEAD)" == "$EXPECTED_SHA" ]] || { echo "candidate checkout is not the exact commit"; exit 1; }
          img="ghcr.io/smc-os/geocore-recovery-api"
          echo "::add-mask::$GH_TOKEN_VALUE"
          echo "$GH_TOKEN_VALUE" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin
          docker build --label "org.opencontainers.image.revision=$EXPECTED_SHA" --label "org.opencontainers.image.source=https://github.com/SMC-OS/GeoCore-OS" -t "$img:$EXPECTED_SHA" candidate
          docker push "$img:$EXPECTED_SHA"
          ref="$(docker inspect --format '{{index .RepoDigests 0}}' "$img:$EXPECTED_SHA")"
          echo "IMAGE_REF=$ref" >> "$GITHUB_ENV"; echo "REG_USER=$GH_ACTOR" >> "$GITHUB_ENV"; echo "REG_TOKEN=$GH_TOKEN_VALUE" >> "$GITHUB_ENV"
          echo "image built from $EXPECTED_SHA: $ref"
      - name: Probe whether Railway accepts the pinned private image (no volumes created)
        if: ${{ inputs.mode == 'probe-app' }}
        run: bash scripts/disposable/recovery_run.sh probe-app
      - name: Recover on replacement infrastructure, verify, ALWAYS tear down
        if: ${{ inputs.mode == 'recover' }}
        shell: bash
        run: |
          set -u -o pipefail
          [[ "$(sha256sum recovery-bundle.tgz | cut -d' ' -f1)" == "$(cat recovery-bundle.sha256)" ]] || { echo "bundle digest mismatch"; exit 1; }
          bash scripts/disposable/recovery_run.sh run recovery-bundle.tgz
      - name: Retain redacted recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: geocore-recovery-evidence
          path: recovery-evidence.txt
          retention-days: 30
          if-no-files-found: ignore
      - name: Final emptiness check (always)
        if: always()
        run: bash scripts/disposable/recovery_run.sh inventory
